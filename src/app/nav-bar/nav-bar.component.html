<div class="nav">
    <h1>Brayan Meza</h1>

    <ul class="list">
        <li class="item"><a href="#about">{{ 'NAV.ABOUT' | translate }}</a></li>
        <li class="item"><a href="#education">{{ 'NAV.EDUCATION' | translate }}</a></li>
        <li class="item"><a href="#experience">{{ 'NAV.EXPERIENCE' | translate }}</a></li>
        <li class="item"><a href="#technologies">{{ 'NAV.TECHNOLOGIES' | translate }}</a></li>
        <li class="item"><a href="#projects">{{ 'NAV.PROJECTS' | translate }}</a></li>
        <li class="item"><a href="#contact">{{ 'NAV.CONTACT' | translate }}</a></li>
    </ul>

    <div class="nav-controls">
        <button
            type="button"
            class="theme-toggle"
            (click)="toggleTheme()"
            [title]="isDarkMode ? 'Modo claro' : 'Modo oscuro'"
            [attr.aria-label]="isDarkMode ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        >
            @if (isDarkMode) {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"/>
                    <line x1="12" y1="1" x2="12" y2="3"/>
                    <line x1="12" y1="21" x2="12" y2="23"/>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                    <line x1="1" y1="12" x2="3" y2="12"/>
                    <line x1="21" y1="12" x2="23" y2="12"/>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                </svg>
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            }
        </button>

        <button
            type="button"
            class="language-toggle"
            (click)="toggleLanguage()"
            [title]="currentLanguage === 'es' ? 'Switch to English' : 'Cambiar a español'"
            [attr.aria-label]="currentLanguage === 'es' ? 'Switch to English' : 'Cambiar a español'"
        >
            <span class="flag-icon" [class.active]="currentLanguage === 'es'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" width="24" height="16">
                    <rect width="750" height="500" fill="#c60b1e"/>
                    <rect width="750" height="250" y="125" fill="#ffc400"/>
                </svg>
            </span>
            <span class="divider">|</span>
            <span class="flag-icon" [class.active]="currentLanguage === 'en'">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7410 3900" width="24" height="16">
                    <rect width="7410" height="3900" fill="#b22234"/>
                    <path d="M0,450H7410m0,600H0m0,600H7410m0,600H0m0,600H7410m0,600H0" stroke="#fff" stroke-width="300"/>
                    <rect width="2964" height="2100" fill="#3c3b6e"/>
                    <g fill="#fff">
                        <g id="s18">
                            <g id="s9">
                                <g id="s5">
                                    <g id="s4">
                                        <path id="s" d="M247,90 317.534230,307.082039 132.873218,172.917961H361.126782L176.465770,307.082039z"/>
                                        <use href="#s" y="420"/>
                                        <use href="#s" y="840"/>
                                        <use href="#s" y="1260"/>
                                    </g>
                                    <use href="#s" y="1680"/>
                                </g>
                                <use href="#s4" x="247" y="210"/>
                            </g>
                            <use href="#s9" x="494"/>
                        </g>
                        <use href="#s18" x="988"/>
                        <use href="#s9" x="1976"/>
                        <use href="#s5" x="2470"/>
                    </g>
                </svg>
            </span>
        </button>
    </div>
</div>
